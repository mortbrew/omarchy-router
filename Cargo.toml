[package]
name = "omarchy-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Real dollar spend and usage from OpenRouter, plus an Omarchy bar widget."
license = "MIT"
repository = "https://github.com/mortbrew/omarchy-router"
keywords = ["openrouter", "cost", "omarchy", "quickshell", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "omarchy-router"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
